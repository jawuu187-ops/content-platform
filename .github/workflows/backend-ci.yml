name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

env:
  GOFLAGS: -trimpath

jobs:
  test:
    name: format, vet, test (real PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # The shared rate limiter needs a real Redis/Valkey: the point of the test
      # is two independent instances agreeing on one budget, which an in-memory
      # fake cannot demonstrate.
      valkey:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: local
      DATABASE_URL: postgres://platform:platform@127.0.0.1:5432/platform_test?sslmode=disable
      VALKEY_URL: redis://127.0.0.1:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: create the isolated identity test database
        run: |
          psql "postgres://platform:platform@127.0.0.1:5432/platform_test" -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE platform_identity_test' 

      - name: unit + integration tests (race detector needs cgo)
        env:
          CGO_ENABLED: "1"
          # Integration tests create their own schema via the embedded migrations
          # and truncate only identity tables, so they run against a dedicated
          # database and never disturb the smoke-test database below.
          TEST_DATABASE_URL: postgres://platform:platform@127.0.0.1:5432/platform_identity_test?sslmode=disable
        run: go test -race -shuffle=on -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -n 25

      - name: build binaries (static, no cgo)
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=ci -X main.commit=${GITHUB_SHA::8}" -o bin/api ./cmd/api
          go build -trimpath -ldflags "-s -w" -o bin/migrate ./cmd/migrate

      - name: apply migrations to the service database (twice, proving idempotency)
        run: |
          ./bin/migrate
          ./bin/migrate
          ./bin/migrate -status

      - name: smoke test the API against the migrated database
        env:
          # 32-byte key, base64. Enables TOTP enrolment in the smoke run so the
          # path is proven outside the test binary as well.
          MFA_KEY: a2tra2tra2tra2tra2tra2tra2tra2tra2tra2tra2s=
          # Passkeys in the smoke run: the RP is localhost, which is the one host
          # the WebAuthn spec allows over plain http.
          WEBAUTHN_RP_ID: localhost
          WEBAUTHN_ORIGINS: http://localhost:8080
          # Development-only switch so the subscription/entitlement path can be
          # proven end to end without a payment provider. Production refuses to
          # start with it on (config validation).
          ENABLE_FAKE_PAYMENTS: "true"
          DATABASE_URL: postgres://platform:platform@127.0.0.1:5432/platform_test?sslmode=disable
          # Age verification: the callback receiver is real code; its secret is a
          # CI value and no hosted provider session exists, so the pending check is
          # seeded directly below to prove the callback -> gate path.
          AGE_PROVIDER: smoke
          AGE_CALLBACK_SECRET: smoke-age-secret-0123456789
          # Media is stored on the runner's disk for the smoke run only; the
          # interface is the same one an object store would implement.
          MEDIA_LOCAL_DIR: ${{ runner.temp }}/media
          MEDIA_SIGNING_KEY: smoke-media-signing-key-0123456789abcdef
          # Development fake: proves the settlement, ledger and grant path. The
          # API refuses this provider outside local/test.
          PAY_PROVIDER: fake
          PAY_WEBHOOK_SECRET: smoke-payment-webhook-secret-0123456789
        run: |
          set -u
          ./bin/api > api.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8080/readyz > ready.json; then break; fi
            sleep 0.5
          done
          fail() {
            echo "SMOKE FAILURE: $1"
            echo "--- last responses ---"
            for f in ready.json meta.json me.json register.json; do
              [ -f "$f" ] && { echo "== $f"; cat "$f"; echo; }
            done
            echo "--- api.log ---"
            tail -n 60 api.log || true
            exit 1
          }
          cat ready.json; echo
          grep -q '"database":"ok"' ready.json || fail "readiness did not report the database"

          meta_code=$(curl -s -o meta.json -w '%{http_code}' http://127.0.0.1:8080/v1/meta)
          echo "GET /v1/meta -> $meta_code"
          [ "$meta_code" = "200" ] || fail "meta endpoint returned $meta_code"
          grep -q '"minimum_age":18' meta.json || fail "meta payload is missing the age floor"

          me_code=$(curl -s -o me.json -w '%{http_code}' http://127.0.0.1:8080/v1/auth/me)
          echo "GET /v1/auth/me (anonymous) -> $me_code"
          [ "$me_code" = "401" ] || fail "anonymous access to /v1/auth/me returned $me_code"

          register_code=$(curl -s -o register.json -w '%{http_code}' -X POST http://127.0.0.1:8080/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.test","password":"a-very-long-password","device":{"fingerprint":"ci","platform":"web"}}')
          echo "POST /v1/auth/register -> $register_code"
          [ "$register_code" = "201" ] || fail "registration returned $register_code"
          grep -q '"roles":\["fan"\]' register.json || fail "registration did not grant the fan role"

          access=$(python3 -c 'import json,sys; print(json.load(open("register.json"))["tokens"]["access_token"])') \
            || fail "registration response carried no access token"
          sessions_code=$(curl -s -o sessions.json -w '%{http_code}' http://127.0.0.1:8080/v1/auth/sessions \
            -H "Authorization: Bearer $access")
          echo "GET /v1/auth/sessions (bearer) -> $sessions_code"
          [ "$sessions_code" = "200" ] || fail "authenticated session listing returned $sessions_code"
          grep -q '"sessions":\[' sessions.json || fail "session listing payload is empty"

          totp_code=$(curl -s -o totp.json -w '%{http_code}' -X POST http://127.0.0.1:8080/v1/auth/mfa/totp/start \
            -H "Authorization: Bearer $access" -H 'Content-Type: application/json' -d '{"label":"smoke"}')
          echo "POST /v1/auth/mfa/totp/start -> $totp_code"
          [ "$totp_code" = "201" ] || fail "TOTP enrolment returned $totp_code"
          grep -q 'otpauth://totp/' totp.json || fail "TOTP enrolment returned no otpauth URI"

          verify_code=$(curl -s -o verify.json -w '%{http_code}' -X POST http://127.0.0.1:8080/v1/auth/email/verify/request \
            -H "Authorization: Bearer $access")
          echo "POST /v1/auth/email/verify/request -> $verify_code"
          [ "$verify_code" = "202" ] || fail "email verification request returned $verify_code"

          pk_code=$(curl -s -o pk.json -w '%{http_code}' -X POST http://127.0.0.1:8080/v1/auth/webauthn/register/start \
            -H "Authorization: Bearer $access" -H 'Content-Type: application/json' -d '{"label":"smoke"}')
          echo "POST /v1/auth/webauthn/register/start -> $pk_code"
          [ "$pk_code" = "201" ] || fail "passkey registration start returned $pk_code"
          grep -q '"userVerification":"required"' pk.json || fail "passkey options do not require user verification"

          grant_code=$(curl -s -o grant.json -w '%{http_code}' -X POST http://127.0.0.1:8080/v1/admin/roles/grant \
            -H "Authorization: Bearer $access" -H 'Content-Type: application/json' \
            -d '{"user_id":"smoke@example.test","role":"creator"}')
          echo "POST /v1/admin/roles/grant (as fan) -> $grant_code"
          [ "$grant_code" = "403" ] || fail "a fan was able to reach the role-grant endpoint ($grant_code)"

          dup_code=$(curl -s -o duplicate.json -w '%{http_code}' -X POST http://127.0.0.1:8080/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.test","password":"a-very-long-password","device":{"fingerprint":"ci","platform":"web"}}')
          echo "POST /v1/auth/register (duplicate) -> $dup_code"
          [ "$dup_code" = "409" ] || fail "duplicate registration returned $dup_code"

          creator_code=$(curl -s -o creator.json -w '%{http_code}' -X POST http://127.0.0.1:8080/v1/creators \
            -H "Authorization: Bearer $access" -H 'Content-Type: application/json' \
            -d '{"handle":"smoke_studio","display_name":"Smoke Studio","bio":"CI fixture","category":"art"}')
          echo "POST /v1/creators -> $creator_code"
          [ "$creator_code" = "201" ] || fail "creator profile creation returned $creator_code"
          python3 -c 'import json,sys; r=json.load(open("creator.json"))["roles"]; sys.exit(0 if "creator" in r and "fan" in r else 1)' \
            || fail "creator profile creation did not grant the creator role: $(cat creator.json)"

          draft_code=$(curl -s -o draft.json -w '%{http_code}' http://127.0.0.1:8080/v1/creators/smoke_studio)
          echo "GET /v1/creators/smoke_studio (unpublished) -> $draft_code"
          [ "$draft_code" = "404" ] || fail "an unpublished profile is publicly readable ($draft_code)"

          publish_code=$(curl -s -o publish.json -w '%{http_code}' -X PATCH http://127.0.0.1:8080/v1/creators/me \
            -H "Authorization: Bearer $access" -H 'Content-Type: application/json' -d '{"published":true}')
          echo "PATCH /v1/creators/me -> $publish_code"
          [ "$publish_code" = "200" ] || fail "publishing the profile returned $publish_code"

          tier_code=$(curl -s -o tier.json -w '%{http_code}' -X POST http://127.0.0.1:8080/v1/creators/me/tiers \
            -H "Authorization: Bearer $access" -H 'Content-Type: application/json' \
            -d '{"name":"Smoke Tier","price_minor":1200,"currency":"USD","perks":["All posts"]}')
          echo "POST /v1/creators/me/tiers -> $tier_code"
          [ "$tier_code" = "201" ] || fail "tier creation returned $tier_code"
          tier_id=$(python3 -c 'import json; print(json.load(open("tier.json"))["tier"]["id"])') \
            || fail "tier response carried no id"

          public_code=$(curl -s -o public.json -w '%{http_code}' http://127.0.0.1:8080/v1/creators/smoke_studio)
          echo "GET /v1/creators/smoke_studio (published) -> $public_code"
          [ "$public_code" = "200" ] || fail "published profile returned $public_code"
          grep -q '"name":"Smoke Tier"' public.json || fail "published profile did not list its tier"

          fan_code=$(curl -s -o fan.json -w '%{http_code}' -X POST http://127.0.0.1:8080/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"smoke-fan@example.test","password":"a-very-long-password","device":{"fingerprint":"ci-fan","platform":"web"}}')
          echo "POST /v1/auth/register (subscriber) -> $fan_code"
          [ "$fan_code" = "201" ] || fail "subscriber registration returned $fan_code"
          fan_access=$(python3 -c 'import json; print(json.load(open("fan.json"))["tokens"]["access_token"])') \
            || fail "subscriber registration carried no access token"

          deny_code=$(curl -s -o deny.json -w '%{http_code}' \
            "http://127.0.0.1:8080/v1/creators/smoke_studio/access?scope=subscriber" \
            -H "Authorization: Bearer $fan_access")
          echo "GET access (before subscribing) -> $deny_code"
          [ "$deny_code" = "200" ] || fail "the access decision returned $deny_code"
          grep -q '"allowed":false' deny.json || fail "a non-subscriber was granted subscriber access"

          sub_code=$(curl -s -o sub.json -w '%{http_code}' -X POST http://127.0.0.1:8080/v1/creators/smoke_studio/subscribe \
            -H "Authorization: Bearer $fan_access" -H 'Content-Type: application/json' -d "{\"tier_id\":\"$tier_id\"}")
          echo "POST /v1/creators/smoke_studio/subscribe -> $sub_code"
          [ "$sub_code" = "201" ] || fail "subscription activation returned $sub_code"

          gated_code=$(curl -s -o gated.json -w '%{http_code}' \
            "http://127.0.0.1:8080/v1/creators/smoke_studio/access?scope=subscriber" \
            -H "Authorization: Bearer $fan_access")
          echo "GET access (subscribed, unverified) -> $gated_code"
          [ "$gated_code" = "200" ] || fail "the access decision returned $gated_code"
          grep -q '"reason":"age_verification_required"' gated.json || fail "an unverified subscriber was not gated by age verification: $(cat gated.json)"

          fan_id=$(python3 -c 'import json; print(json.load(open("fan.json"))["user"]["id"])') \
            || fail "subscriber response carried no user id"
          ref="smoke_ref_$$"
          psql "$DATABASE_URL" -q -c "INSERT INTO verify.checks (user_id, status, method, provider, provider_ref) \
            VALUES ('$fan_id', 'pending', 'provider', 'smoke', '$ref')" \
            || fail "could not seed a pending verification check"
          python3 - "$fan_id" "$ref" <<'PY'
          import hashlib, hmac, json, sys, time
          fan, ref = sys.argv[1], sys.argv[2]
          body = json.dumps({
              "event_id": "smoke_evt_" + ref,
              "reference": ref,
              "account_id": fan,
              "status": "verified",
              "assurance": "ci_signed_callback",
              "min_age": 18,
              "verified_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
          }).encode()
          ts = str(int(time.time()))
          sig = hmac.new(b"smoke-age-secret-0123456789", ts.encode() + b"." + body, hashlib.sha256).hexdigest()
          open("age_body.json", "wb").write(body)
          open("age_sig.txt", "w").write("t=%s,v1=%s" % (ts, sig))
          PY

          cb_code=$(curl -s -o age_cb.json -w '%{http_code}' -X POST http://127.0.0.1:8080/v1/verify/age/callback \
            -H "X-Age-Signature: $(cat age_sig.txt)" -H 'Content-Type: application/json' \
            --data-binary @age_body.json)
          echo "POST /v1/verify/age/callback (signed) -> $cb_code"
          [ "$cb_code" = "202" ] || fail "the signed verification callback returned $cb_code"

          allow_code=$(curl -s -o allow.json -w '%{http_code}' \
            "http://127.0.0.1:8080/v1/creators/smoke_studio/access?scope=subscriber" \
            -H "Authorization: Bearer $fan_access")
          echo "GET access (subscribed, verified) -> $allow_code"
          [ "$allow_code" = "200" ] || fail "the access decision returned $allow_code"
          grep -q '"allowed":true' allow.json || fail "a verified subscriber was refused subscriber access"

          verify_code=$(curl -s -o age_status.json -w "%{http_code}" http://127.0.0.1:8080/v1/verify/age \
            -H "Authorization: Bearer $fan_access")
          echo "GET /v1/verify/age -> $verify_code"
          [ "$verify_code" = "200" ] || fail "verification status returned $verify_code"
          grep -q '"verified":true' age_status.json || fail "verification status did not report the account as verified"

          # Media: upload, publish, deliver, and prove a link is single use.
          python3 - <<'PY'
          import struct, zlib
          def chunk(t, d):
              return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xFFFFFFFF)
          raw = b"".join(b"\x00" + bytes([200, 30, 60]) * 4 for _ in range(4))
          png = (b"\x89PNG\r\n\x1a\n"
                 + chunk(b"IHDR", struct.pack(">IIBBBBB", 4, 4, 8, 2, 0, 0, 0))
                 + chunk(b"IDAT", zlib.compress(raw))
                 + chunk(b"IEND", b""))
          open("smoke.png", "wb").write(png)
          PY

          upload_code=$(curl -s -o upload.json -w '%{http_code}' -X POST http://127.0.0.1:8080/v1/media \
            -H "Authorization: Bearer $access" -H 'Content-Type: image/png' --data-binary @smoke.png)
          echo "POST /v1/media -> $upload_code"
          [ "$upload_code" = "201" ] || fail "media upload returned $upload_code"
          ! grep -q 'storage_key' upload.json || fail "media upload leaked its storage key"
          media_id=$(python3 -c 'import json; print(json.load(open("upload.json"))["media"]["id"])') \
            || fail "media upload carried no id"

          post_code=$(curl -s -o post.json -w '%{http_code}' -X POST http://127.0.0.1:8080/v1/posts \
            -H "Authorization: Bearer $access" -H 'Content-Type: application/json' \
            -d "{\"body\":\"smoke post\",\"visibility\":\"public\",\"published\":true,\"media_ids\":[\"$media_id\"]}")
          echo "POST /v1/posts -> $post_code"
          [ "$post_code" = "201" ] || fail "post creation returned $post_code"
          post_id=$(python3 -c 'import json; print(json.load(open("post.json"))["post"]["id"])') \
            || fail "post creation carried no id"

          feed_code=$(curl -s -o feed.json -w '%{http_code}' http://127.0.0.1:8080/v1/creators/smoke_studio/posts)
          echo "GET /v1/creators/smoke_studio/posts -> $feed_code"
          [ "$feed_code" = "200" ] || fail "the public feed returned $feed_code"
          ! grep -q '/v1/media/delivery/' feed.json || fail "the feed exposed a delivery link to an anonymous visitor"

          link_code=$(curl -s -o link.json -w '%{http_code}' -X POST "http://127.0.0.1:8080/v1/media/$media_id/delivery" \
            -H "Authorization: Bearer $fan_access" -H 'Content-Type: application/json' -d "{\"post_id\":\"$post_id\"}")
          echo "POST /v1/media/{id}/delivery -> $link_code"
          [ "$link_code" = "201" ] || fail "delivery link issue returned $link_code"
          delivery_url=$(python3 -c 'import json; print(json.load(open("link.json"))["delivery"]["url"])') \
            || fail "delivery response carried no url"

          first_code=$(curl -s -o delivered.png -w '%{http_code}' "http://127.0.0.1:8080$delivery_url")
          echo "GET delivery link (first use) -> $first_code"
          [ "$first_code" = "200" ] || fail "delivery redemption returned $first_code"
          cmp -s smoke.png delivered.png || fail "delivered bytes differ from the uploaded bytes"

          replay_code=$(curl -s -o replay.json -w '%{http_code}' "http://127.0.0.1:8080$delivery_url")
          echo "GET delivery link (replay) -> $replay_code"
          [ "$replay_code" = "403" ] || fail "a delivery link was reusable ($replay_code)"

          # Payments: buy the pay-per-view post, settle it with a signed callback,
          # and prove the ledger balances.
          ppv_code=$(curl -s -o ppv.json -w '%{http_code}' -X POST http://127.0.0.1:8080/v1/posts \
            -H "Authorization: Bearer $access" -H 'Content-Type: application/json' \
            -d "{\"body\":\"paid post\",\"visibility\":\"ppv\",\"price_minor\":500,\"currency\":\"USD\",\"published\":true,\"media_ids\":[\"$media_id\"]}")
          echo "POST /v1/posts (ppv) -> $ppv_code"
          [ "$ppv_code" = "201" ] || fail "pay-per-view post creation returned $ppv_code"
          ppv_id=$(python3 -c 'import json; print(json.load(open("ppv.json"))["post"]["id"])') \
            || fail "ppv post carried no id"

          intent_code=$(curl -s -o intent.json -w '%{http_code}' -X POST http://127.0.0.1:8080/v1/payments/intents \
            -H "Authorization: Bearer $fan_access" -H 'Content-Type: application/json' \
            -d "{\"purpose\":\"ppv\",\"post_id\":\"$ppv_id\",\"idempotency_key\":\"smoke-$ppv_id\"}")
          echo "POST /v1/payments/intents -> $intent_code"
          meta_json=$(curl -s http://127.0.0.1:8080/v1/meta)
          echo "$meta_json" | grep -q '"data_class":"test"' || fail "meta did not report the test data class"
          echo "$meta_json" | grep -q '"simulated":true' || fail "meta did not report the simulated provider"
          [ "$intent_code" = "201" ] || fail "payment intent creation returned $intent_code"
          grep -q '"amount_minor":500' intent.json || fail "the intent amount did not come from the post price"
          # The simulated provider must stamp its work as test data, and the instance
          # must advertise that class. A production build reports data_class=none.
          grep -q '"simulated":true' intent.json || fail "a simulated intent was not marked as test data"
          intent_id=$(python3 -c 'import json; print(json.load(open("intent.json"))["payment"]["id"])') \
            || fail "intent carried no id"

          python3 - "$intent_id" <<'PY'
          import hashlib, hmac, json, sys, time
          intent = sys.argv[1]
          body = json.dumps({
              "event_id": "smoke_pay_" + intent,
              "kind": "payment.succeeded",
              "intent_id": intent,
              "amount_minor": 500,
              "currency": "USD",
          }).encode()
          ts = str(int(time.time()))
          sig = hmac.new(b"smoke-payment-webhook-secret-0123456789", ts.encode() + b"." + body, hashlib.sha256).hexdigest()
          open("pay_body.json", "wb").write(body)
          open("pay_sig.txt", "w").write("t=%s,v1=%s" % (ts, sig))
          PY

          settle_code=$(curl -s -o settle.json -w '%{http_code}' -X POST http://127.0.0.1:8080/v1/payments/webhook \
            -H "X-Payment-Signature: $(cat pay_sig.txt)" -H 'Content-Type: application/json' \
            --data-binary @pay_body.json)
          echo "POST /v1/payments/webhook -> $settle_code"
          [ "$settle_code" = "200" ] || fail "the signed payment callback returned $settle_code"

          status_code=$(curl -s -o pay_status.json -w '%{http_code}' "http://127.0.0.1:8080/v1/payments/$intent_id" \
            -H "Authorization: Bearer $fan_access")
          echo "GET /v1/payments/{id} -> $status_code"
          [ "$status_code" = "200" ] || fail "payment status returned $status_code"
          grep -q '"status":"succeeded"' pay_status.json || fail "the payment did not settle: $(cat pay_status.json)"

          paid_link=$(curl -s -o paid_link.json -w '%{http_code}' -X POST "http://127.0.0.1:8080/v1/media/$media_id/delivery" \
            -H "Authorization: Bearer $fan_access" -H 'Content-Type: application/json' -d "{\"post_id\":\"$ppv_id\"}")
          echo "POST delivery for the purchased post -> $paid_link"
          [ "$paid_link" = "201" ] || fail "the purchased post did not issue a link ($paid_link)"
          paid_url=$(python3 -c 'import json; print(json.load(open("paid_link.json"))["delivery"]["url"])')
          paid_fetch=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$paid_url")
          echo "GET purchased delivery -> $paid_fetch"
          [ "$paid_fetch" = "200" ] || fail "the purchased post did not deliver ($paid_fetch)"

          tb=$(psql "$DATABASE_URL" -tAq -c "SELECT COALESCE(sum(amount_minor),0) FROM ledger.entries")
          echo "ledger net minor units -> $tb"
          [ "$tb" = "0" ] || fail "the ledger does not balance: $tb"

          replay_code=$(curl -s -o replay_pay.json -w '%{http_code}' -X POST http://127.0.0.1:8080/v1/payments/webhook \
            -H "X-Payment-Signature: $(cat pay_sig.txt)" -H 'Content-Type: application/json' \
            --data-binary @pay_body.json)
          echo "POST /v1/payments/webhook (replay) -> $replay_code"
          [ "$replay_code" = "202" ] || fail "a replayed payment callback returned $replay_code"

          kill %1 2>/dev/null || true

      - name: upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out
          retention-days: 14

      - name: upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-failure-logs
          path: backend/api.log
          if-no-files-found: ignore

  container:
    name: container image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build image (never pushed from CI without a release tag)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: content-platform/api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
