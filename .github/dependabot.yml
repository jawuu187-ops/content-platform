# Dependency updates. Grouped so a single pull request per ecosystem keeps the
# review load low, while security updates still open immediately.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns: ["*"]
    labels: ["dependencies", "backend"]

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      android-dependencies:
        patterns: ["*"]
    # Major upgrades (AGP 9, Kotlin 2.3+, Compose BOM that needs a newer SDK) are
    # deliberate migrations: they land on a branch with a green CI run, never as
    # an automatic pull request.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies", "android"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies", "ci"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: ["dependencies", "docker"]
