<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Splash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/app.css">
</head><body class="screen">
<div class="phone" style="display:flex;flex-direction:column">
  <div class="statusbar"><span>9:41</span><span class="icons"><span class="bar-dot"></span><span class="bar-dot"></span><span class="bar-dot"></span><span class="batt"></span></span></div>

  <div style="flex:1;display:grid;place-items:center;padding:0 32px">
    <div class="center">
      <div style="width:64px;height:64px;border-radius:20px;margin:0 auto 28px;display:grid;place-items:center;
                  background:linear-gradient(150deg,#e0a458,#c98d8f 55%,#9c8ac4);box-shadow:0 18px 50px rgba(224,164,88,.28)">
        <span style="font-family:var(--serif);font-size:30px;font-weight:600;color:#16101c">c</span>
      </div>
      <div class="display" style="font-size:38px">content<br>platform</div>
      <div style="width:44px;height:2px;background:var(--amber);margin:22px auto 18px"></div>
      <p class="muted small" style="max-width:250px;margin:0 auto">
        A private place for creators and the people who follow them.
      </p>
    </div>
  </div>

  <div style="padding:0 32px 30px">
    <div class="row" style="justify-content:center;gap:8px;margin-bottom:22px">
      <span class="chip amber">18+ only</span>
      <span class="chip">Age-verified content</span>
    </div>
    <div class="row between tiny dim">
      <span>v1.0.0 (dev)</span>
      <span>Terms · Privacy</span>
    </div>
  </div>
</div>
</body></html>
