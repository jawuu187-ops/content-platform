name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1" # weekly, Monday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secret scanning (gitleaks)
    # Dependabot pull requests run with a read-only token and cannot call the
    # gitleaks API; every push to a branch runs this job with full access, so the
    # commit set is still scanned.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  go-vulnerabilities:
    name: Go vulnerability check (govulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: backend/go.mod
          go-package: ./...
          work-dir: backend
          output-format: sarif
          output-file: govulncheck.sarif
          repo-checkout: false
      - name: upload sarif
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: govulncheck-sarif
          path: backend/govulncheck.sarif
          if-no-files-found: ignore

  filesystem-scan:
    name: filesystem and dependency scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: scan for HIGH and CRITICAL findings
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
          skip-dirs: "android/app/build,backend/bin"

  dependency-review:
    name: dependency review (pull requests)
    # The action needs the dependency graph and GitHub Advanced Security, which a
    # private repository on the free plan does not have. Dependabot PRs are
    # therefore skipped rather than failed; docs/operations/ci.md records the
    # upgrade that would enable them.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0

  go-static-analysis:
    # CodeQL code scanning requires GitHub Advanced Security on private
    # repositories (a paid feature) and is therefore not enabled on this plan.
    # gosec and staticcheck cover the same ground at no cost; CodeQL can be
    # re-added by uncommenting the job in docs/operations/ci.md once the owner
    # upgrades the plan or the repository becomes public.
    name: static analysis (gosec + staticcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: gosec (medium and above fail the build)
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.30.0 -severity medium -fmt sarif -out gosec.sarif ./...

      - name: gosec findings (printed on failure)
        if: failure()
        run: |
          python3 - <<'PY'
          import json
          try:
              data = json.load(open("gosec.sarif"))
          except Exception as exc:
              print("no SARIF report:", exc)
              raise SystemExit(0)
          for run in data.get("runs", []):
              for result in run.get("results", []):
                  loc = result["locations"][0]["physicalLocation"]
                  print(result["ruleId"],
                        loc["artifactLocation"]["uri"],
                        loc["region"]["startLine"],
                        result["message"]["text"])
          PY

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      - name: upload gosec report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gosec-sarif
          path: backend/gosec.sarif
          if-no-files-found: ignore
