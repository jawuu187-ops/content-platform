# Owner-authorized testing APK. GitHub-hosted runners only; never an AAB.
# The release keystore is supplied from repository secrets, never committed.
name: Android test APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Public HTTPS API the APK must use
        required: true
        default: https://80.47.235.113.sslip.io
        type: string

permissions:
  contents: read

concurrency:
  group: android-test-apk
  cancel-in-progress: false

defaults:
  run:
    working-directory: android

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
    -Dorg.gradle.parallel=true -Dorg.gradle.caching=true
  CI: "true"

jobs:
  build:
    name: signed testing APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: provision Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
          cache-read-only: true

      - name: materialize the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::ANDROID_KEYSTORE_BASE64 is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: build the signed release APK only
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease \
            -PapiBaseUrl="$API_BASE_URL" \
            -PreleaseKeystoreFile="$RUNNER_TEMP/release.jks" \
            -PreleaseStorePassword="$ANDROID_KEYSTORE_PASSWORD" \
            -PreleaseKeyAlias="$ANDROID_KEY_ALIAS" \
            -PreleaseKeyPassword="$ANDROID_KEY_PASSWORD"
          test -f app/build/outputs/apk/release/app-release.apk
          if find app/build/outputs -name '*.aab' | grep -q .; then
            echo "::error::an AAB was produced; this workflow allows only the testing APK"
            exit 1
          fi

      - name: verify package, version and signature
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/signature.txt"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          grep -q "package: name='com.contentplatform.app'" "$RUNNER_TEMP/badging.txt"
          grep -q "versionCode='3'" "$RUNNER_TEMP/badging.txt"
          grep -q "versionName='0.2.1-test'" "$RUNNER_TEMP/badging.txt"
          grep -q 'Verifies' "$RUNNER_TEMP/signature.txt"
          grep -q 'https://80.47.235.113.sslip.io' app/build/generated/source/buildConfig/release/com/contentplatform/app/BuildConfig.java
          sha256sum "$APK" | tee "$RUNNER_TEMP/sha256.txt"
          cp "$RUNNER_TEMP/signature.txt" "$RUNNER_TEMP/badging.txt" "$RUNNER_TEMP/sha256.txt" app/build/outputs/apk/release/

      - name: upload the testing APK
        uses: actions/upload-artifact@v4
        with:
          name: content-platform-testing-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/signature.txt
            android/app/build/outputs/apk/release/badging.txt
            android/app/build/outputs/apk/release/sha256.txt
          if-no-files-found: error
          retention-days: 30
