# Device verification: the installed Android app against a live API.
#
# Everything runs on a GitHub-hosted runner. The API, its PostgreSQL database and the
# fixture are disposable and exist only for this job; the app is the debug build and the
# payment provider is the development fake, so no real money and no production record can
# be touched. The emulator reaches the API on the runner's loopback through 10.0.2.2.
name: Android E2E (emulator)

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "backend/**"
      - ".github/workflows/android-e2e.yml"
  pull_request:
    paths:
      - "android/**"
      - "backend/**"
      - ".github/workflows/android-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
    -Dorg.gradle.parallel=true -Dorg.gradle.caching=true
  CI: "true"
  # The API runs as `local` because this database is thrown away with the runner. Outside
  # local the service requires deployment secrets it must not carry in CI, and the guard in
  # cmd/e2eseed accepts only local or demo.
  APP_ENV: local
  DATABASE_URL: postgres://platform:platform@127.0.0.1:5432/platform_e2e?sslmode=disable
  PAY_PROVIDER: fake
  PAY_WEBHOOK_SECRET: e2e-payment-webhook-secret-0123456789
  ENABLE_FAKE_PAYMENTS: "true"
  MEDIA_LOCAL_DIR: ${{ github.workspace }}/.e2e-media
  MEDIA_SIGNING_KEY: e2e-media-signing-key-0123456789abcdef
  # Generated per run, shared by the seed tool and the device test. Not a secret and not
  # committed: the account lives only in this job's disposable database.
  E2E_PASSWORD: e2e-device-${{ github.run_id }}-${{ github.run_attempt }}-password

jobs:
  device-tests:
    name: messaging, tips, theme and expiry on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: platform_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d platform_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: provision Gradle (no wrapper required)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: build the API, the migrator and the fixture tool
        working-directory: backend
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -o bin/api ./cmd/api
          go build -trimpath -o bin/migrate ./cmd/migrate
          go build -trimpath -o bin/e2eseed ./cmd/e2eseed

      - name: migrate the disposable database
        working-directory: backend
        run: ./bin/migrate

      - name: start the API on the runner loopback
        working-directory: backend
        run: |
          nohup ./bin/api > api.log 2>&1 &
          disown
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/readyz > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/readyz | tee ready.json
          grep -q '"database":"ok"' ready.json
          # The app must see the same data class the database carries.
          curl -sf http://127.0.0.1:8080/v1/meta | tee meta.json
          grep -q '"data_class":"test"' meta.json

      - name: seed one fan, one creator, one membership and one conversation
        working-directory: backend
        run: |
          E2E_BASE_URL=http://10.0.2.2:8080 ./bin/e2eseed -json "$RUNNER_TEMP/seed.json" | tee "$RUNNER_TEMP/seed.log"
          test -s "$RUNNER_TEMP/seed.json"

      # The emulator needs a CPU accelerator. GitHub's standard Linux runners expose
      # /dev/kvm; when they do not, this step says so instead of leaving a boot timeout
      # to be diagnosed from logs. Nothing here changes the host beyond making the
      # device node usable by the runner user, which the emulator action expects.
      - name: check hardware acceleration for the emulator
        run: |
          echo "--- /dev/kvm"
          ls -l /dev/kvm || echo "no /dev/kvm"
          echo "--- cpu virtualisation flags"
          grep -cE '(vmx|svm)' /proc/cpuinfo || true
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
            ls -l /dev/kvm
          fi

      - name: device tests on an emulator
        env:
          # Harmless when KVM is present; when it is not, the runner is a nested VM and
          # this is the only way the emulator will start at all.
          ANDROID_I_WANT_MY_TCG: ${{ vars.ANDROID_FORCE_TCG || '' }}
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_5
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none
          # The runner executes each line in its own shell, so every line is
          # self-contained: `-p android` instead of a cd that would be forgotten.
          # One shell for the whole script: the screenshots must be pulled even when a
          # test fails, so `rc` collects failures and the exit happens at the end.
          script: |
            set -o pipefail
            rc=0
            gradle -p android --no-daemon --stacktrace :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class='com.contentplatform.app.e2e.MessagingFlowTest,com.contentplatform.app.e2e.TipsFlowTest,com.contentplatform.app.e2e.ThemeAndFailureTest,com.contentplatform.app.e2e.ModerationFlowTest' -Pandroid.testInstrumentationRunnerArguments.e2ePassword="$E2E_PASSWORD" || rc=1
            cp -r android/app/build/outputs/androidTest-results android/app/build/outputs/results-part1 || true
            ./backend/bin/e2eseed -expire || rc=1
            gradle -p android --no-daemon --stacktrace :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.contentplatform.app.e2e.ExpiredMembershipTest -Pandroid.testInstrumentationRunnerArguments.e2ePassword="$E2E_PASSWORD" || rc=1
            cp -r android/app/build/outputs/androidTest-results android/app/build/outputs/results-part2 || true
            gradle -p android --no-daemon --stacktrace :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.contentplatform.app.e2e.ModerationQueueTest -Pandroid.testInstrumentationRunnerArguments.e2ePassword="$E2E_PASSWORD" || rc=1
            cp -r android/app/build/outputs/androidTest-results android/app/build/outputs/results-part3 || true
            mkdir -p e2e-shots
            for name in $(adb shell run-as com.contentplatform.app.debug ls files/e2e | tr -d '\r'); do adb exec-out run-as com.contentplatform.app.debug cat "files/e2e/$name" > "e2e-shots/$name" || true; done
            ls -lR e2e-shots
            exit $rc

      # The device tests prove what the app does. These checks prove what the server
      # refuses, using the same account the app used.
      - name: API contract checks (idempotency, refusals, no real money)
        working-directory: backend
        run: |
          set -euo pipefail
          creator_id="$(jq -r .creator_id "$RUNNER_TEMP/seed.json")"
          conversation_id="$(jq -r .conversation_id "$RUNNER_TEMP/seed.json")"
          payload="$(jq -nc --arg email "fan@e2e.test" --arg password "$E2E_PASSWORD" \
            '{email:$email, password:$password, mfa_code:"", device:{fingerprint:"e2e-api", platform:"ci", name:"curl"}}')"
          token="$(curl -sf -X POST http://127.0.0.1:8080/v1/auth/login \
            -H 'Content-Type: application/json' -d "$payload" \
            | jq -r .tokens.access_token)"
          test -n "$token"

          fail() { echo "E2E FAILURE: $1"; exit 1; }

          # A rejected amount is refused by the server, not only by the sheet.
          code=$(curl -s -o too-small.json -w '%{http_code}' -X POST http://127.0.0.1:8080/v1/tips \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d "{\"creator_id\":\"$creator_id\",\"amount_minor\":50,\"note\":\"\",\"idempotency_key\":\"e2e-small-0001\"}")
          echo "tip below the minimum -> $code"; cat too-small.json; echo
          [ "$code" = "400" ] || fail "a 50-cent tip was not refused ($code)"

          # One key, two requests: the same intent, never a second charge.
          key="e2e-idem-$(date +%s)"
          first=$(curl -sf -X POST http://127.0.0.1:8080/v1/tips \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d "{\"creator_id\":\"$creator_id\",\"amount_minor\":700,\"note\":\"idempotency check\",\"idempotency_key\":\"$key\"}")
          second=$(curl -sf -X POST http://127.0.0.1:8080/v1/tips \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d "{\"creator_id\":\"$creator_id\",\"amount_minor\":700,\"note\":\"idempotency check\",\"idempotency_key\":\"$key\"}")
          first_id="$(echo "$first" | jq -r .tip.id)"
          second_id="$(echo "$second" | jq -r .tip.id)"
          echo "same key -> $first_id / $second_id"
          [ "$first_id" = "$second_id" ] || fail "one idempotency key produced two intents"
          echo "$first" | jq -e '.tip.simulated == true' > /dev/null || fail "tip was not marked simulated"

          # With the membership gone the server refuses the write and keeps the history.
          code=$(curl -s -o send.json -w '%{http_code}' -X POST \
            "http://127.0.0.1:8080/v1/dm/conversations/$conversation_id/messages" \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"body":"this must not be accepted"}')
          echo "send after expiry -> $code"; cat send.json; echo
          [ "$code" = "403" ] || fail "a lapsed member could still send ($code)"
          curl -sf "http://127.0.0.1:8080/v1/dm/conversations/$conversation_id/messages" \
            -H "Authorization: Bearer $token" | jq -e '.messages | length > 0' > /dev/null \
            || fail "history disappeared after the membership ended"

          # Creator earnings are a finance permission, and a fan must not have it.
          code=$(curl -s -o earnings.json -w '%{http_code}' \
            "http://127.0.0.1:8080/v1/creator/earnings" -H "Authorization: Bearer $token")
          echo "fan asking for creator earnings -> $code"
          [ "$code" = "403" ] || fail "a fan could read creator earnings ($code)"

      - name: moderation contract checks (queue is a permission, decisions are recorded)
        working-directory: backend
        run: |
          set -euo pipefail
          fail() { echo "E2E FAILURE: $1"; exit 1; }

          tok() {
            local email="$1"
            local body
            body="$(jq -nc --arg email "$email" --arg pw "$E2E_PASSWORD" \
              '{email:$email, password:$pw, mfa_code:"", device:{fingerprint:"e2e-api", platform:"ci", name:"curl"}}')"
            curl -sf -X POST http://127.0.0.1:8080/v1/auth/login \
              -H 'Content-Type: application/json' -d "$body" | jq -r .tokens.access_token
          }

          fan="$(tok fan@e2e.test)"
          moderator="$(tok moderator@e2e.test)"

          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/v1/moderation/reports \
            -H "Authorization: Bearer $fan")
          echo "fan asking for the moderation queue -> $code"
          [ "$code" = "403" ] || fail "a fan could read the moderation queue ($code)"

          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/v1/reports \
            -H 'Content-Type: application/json' -d '{"subject_type":"message","subject_id":"x","reason":"spam"}')
          echo "anonymous report -> $code"
          [ "$code" = "401" ] || fail "an anonymous report was not refused ($code)"

          # Reporting the same subject twice collapses onto the open report instead of
          # stacking duplicates; the second call is a 200 carrying the first id.
          subject_id="$(jq -r .creator_id "$RUNNER_TEMP/seed.json")"
          rep_body="$(jq -nc --arg sid "$subject_id" \
            '{subject_type:"user", subject_id:$sid, reason:"spam", details:"duplicate probe"}')"
          first_rep=$(curl -s -o first-report.json -w '%{http_code}' -X POST http://127.0.0.1:8080/v1/reports \
            -H "Authorization: Bearer $fan" -H 'Content-Type: application/json' -d "$rep_body")
          second_rep=$(curl -s -o second-report.json -w '%{http_code}' -X POST http://127.0.0.1:8080/v1/reports \
            -H "Authorization: Bearer $fan" -H 'Content-Type: application/json' -d "$rep_body")
          echo "duplicate report -> $first_rep / $second_rep"
          [ "$first_rep" = "201" ] && [ "$second_rep" = "200" ] || fail "duplicate collapse did not behave ($first_rep/$second_rep)"
          jq -e '.report.duplicate == true and .report.id == $id' \
            --arg id "$(jq -r .report.id first-report.json)" second-report.json > /dev/null \
            || fail "the duplicate did not point at the original report"

          # The report the device test filed, and the decision the moderator made.
          curl -sf "http://127.0.0.1:8080/v1/moderation/reports?status=actioned" \
            -H "Authorization: Bearer $moderator" > actioned.json
          count="$(jq '.reports | length' actioned.json)"
          echo "actioned reports: $count"
          jq -c '.reports[0] | {reason, status, resolved_at, events: (.events | length)}' actioned.json
          [ "$count" -ge 1 ] || fail "no actioned report reached the server"
          jq -e '.reports[0].status == "actioned" and .reports[0].resolved_at != null' actioned.json > /dev/null \
            || fail "an actioned report is missing its closure stamp"

          # The trail itself lives on the detail endpoint: submission, review, decision.
          report_id="$(jq -r '.reports[0].id' actioned.json)"
          curl -sf "http://127.0.0.1:8080/v1/reports/$report_id" \
            -H "Authorization: Bearer $moderator" > detail.json
          jq -c '.report.events[] | {action, to_status}' detail.json
          [ "$(jq '.report.events | length' detail.json)" -ge 3 ] \
            || fail "the report history lost the submission, review or decision event"
          jq -e '[.report.events[].to_status] | index("actioned") != null' detail.json > /dev/null \
            || fail "the decision event was not recorded"

      - name: upload device test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-evidence
          path: |
            android/app/build/reports/androidTests/**
            android/app/build/outputs/androidTest-results/**
            android/app/build/outputs/results-part*/**
            e2e-shots/**
            backend/api.log
          retention-days: 14
          if-no-files-found: warn

      - name: API log on failure
        if: failure()
        run: tail -n 120 backend/api.log || true
