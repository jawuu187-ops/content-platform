# Android is built exclusively on GitHub-hosted runners.
#
# Nothing in this repository requires (or permits) an Android SDK, Android Studio
# or Gradle on a developer workstation or a private VPS. If a build breaks, the
# fix lands in this workflow or in the code, never in a local build.
name: Android CI

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
    -Dorg.gradle.parallel=true -Dorg.gradle.caching=true
  CI: "true"

jobs:
  build:
    name: lint, unit tests, APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: validate Gradle wrapper checksum (if a wrapper is committed)
        if: hashFiles('android/gradle/wrapper/gradle-wrapper.jar') != ''
        uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: provision Gradle (no wrapper required)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: compile, lint and unit test
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest :app:lintDebug

      - name: assemble signed release APK and bundle
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Release signing secret $name is not configured; refusing to produce an unsigned release."
              exit 1
            fi
          done
          install -m 600 /dev/null "$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$RUNNER_TEMP/release.keystore"' EXIT
          gradle --no-daemon --stacktrace :app:bundleRelease :app:assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: verify release signature, package and version
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No release APK was produced."
            exit 1
          fi
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -1)
          AAPT=$(find "${ANDROID_HOME}/build-tools" -name aapt -type f | sort -V | tail -1)
          [ -n "$APKSIGNER" ] && [ -n "$AAPT" ] || { echo "::error::Android build-tools verification tools were not found."; exit 1; }

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          grep -q '^Verified using v1 scheme' "$RUNNER_TEMP/apksigner.txt" || true
          CERT=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apksigner.txt" | head -1)
          if [ -z "$CERT" ]; then
            echo "::error::The release APK has no signer certificate."
            exit 1
          fi

          BADGING=$("$AAPT" dump badging "$APK")
          PACKAGE=$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          VNAME=$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p")
          VCODE=$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p")
          DECL_NAME=$(sed -n 's/^ *versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          DECL_CODE=$(sed -n 's/^ *versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)

          [ "$PACKAGE" = "com.contentplatform.app" ] || { echo "::error::Package is $PACKAGE, expected com.contentplatform.app"; exit 1; }
          [ "$VNAME" = "$DECL_NAME" ] || { echo "::error::Version name $VNAME does not match declared $DECL_NAME"; exit 1; }
          [ "$VCODE" = "$DECL_CODE" ] || { echo "::error::Version code $VCODE does not match declared $DECL_CODE"; exit 1; }

          {
            echo "### Signed release verification"
            echo ""
            echo "- Package: \`$PACKAGE\`"
            echo "- Version: \`$VNAME\` (code \`$VCODE\`)"
            echo "- Certificate SHA-256: \`$CERT\`"
            echo "- File: \`$(basename "$APK")\` ($(stat -c %s "$APK") bytes)"
            echo "- apksigner: verified"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: summarise build outputs
        run: |
          {
            echo "### Android build outputs"
            find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -printf '%p  %k KB\n' | sort
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: android/app/build/outputs/bundle/**/*.aab
          retention-days: 14
          if-no-files-found: error

      - name: upload reports (lint, unit tests)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/**
            android/app/build/test-results/**
          retention-days: 14
          if-no-files-found: ignore
