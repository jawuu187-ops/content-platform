<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>02 Discover</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/app.css">
</head><body class="screen">
<div class="frame" style="display:flex;flex-direction:column">
  <div class="statusbar"><span>9:41</span><span class="right"><span class="sig"><i></i><i></i><i></i><i></i></span><span class="batt"></span></span></div>

  <div class="masthead">
    <div class="mark"></div>
    <div class="wordmark">Vesper</div>
    <div class="grow"></div>
    <div class="avatar round" style="width:36px;height:36px;margin-right:-6px">
      <img src="../assets/img/hero.jpg" alt="" style="object-position:52% 16%">
    </div>
  </div>

  <div style="flex:1;overflow:hidden">
    <!-- featured creator: the photograph is the screen -->
    <div class="pad" style="padding-top:12px">
      <div class="cover" style="height:236px;border-radius:var(--r-card)">
        <img src="../assets/img/hero.jpg" alt="" style="object-position:50% 26%">
        <div class="chip tr">Tonight · new set</div>
        <div class="chip bl">12,412 members</div>
      </div>
      <div class="row" style="margin-top:12px;gap:12px">
        <div class="grow">
          <div class="name" style="font-size:21px">Lina Marchetti</div>
          <div class="meta" style="margin-top:2px;text-transform:none">@lina.m · creator since 2024 · 48 posts</div>
        </div>
        <div class="num" style="font-size:16px;font-weight:600">$9<span class="small muted" style="font-weight:400">/mo</span></div>
      </div>
      <div class="btn cta wide" style="margin-top:12px">
        <span>Join Studio</span><span class="p">$9.00 / month</span>
      </div>
      <p class="note" style="margin-top:8px">18+ accounts only. Cancel any time.</p>
    </div>

    <div class="pad" style="margin-top:16px">
      <div class="row between">
        <span style="font-size:16px;font-weight:600">New this week</span>
        <span class="meta">7 creators</span>
      </div>
    </div>

    <div class="pad" style="margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="card">
        <div class="cover" style="height:150px"><img src="../assets/img/creator-noor.jpg" alt=""></div>
        <div class="card-body" style="padding:10px">
          <div style="font-size:14px;font-weight:600">Noor Haddad</div>
          <div class="row between" style="margin-top:4px">
            <span class="meta" style="text-transform:none">8,120 · movement</span>
            <span class="num" style="font-size:12px;font-weight:600">$6</span>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="cover" style="height:150px"><img src="../assets/img/creator-sofia.jpg" alt=""></div>
        <div class="card-body" style="padding:10px">
          <div class="row between" style="align-items:flex-start">
            <span style="font-size:14px;font-weight:600">Sofia Reyes</span>
            <span class="flag sage">Subscribed</span>
          </div>
          <div class="row between" style="margin-top:4px">
            <span class="meta" style="text-transform:none">21,004 · portrait</span>
            <span class="num" style="font-size:12px;font-weight:600">$12</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab on">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20H4z"/></svg>
      Home
    </div>
    <div class="tab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 14l4-4 5 5 3-3 4 4"/></svg>
      Library
    </div>
    <div class="tab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Create
    </div>
    <div class="tab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c1.5-3.5 4-5 7-5s5.5 1.5 7 5"/></svg>
      You
    </div>
  </div>
</div>
</body></html>
