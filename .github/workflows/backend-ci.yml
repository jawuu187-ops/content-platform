name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

env:
  GOFLAGS: -trimpath

jobs:
  test:
    name: format, vet, test (real PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # The shared rate limiter needs a real Redis/Valkey: the point of the test
      # is two independent instances agreeing on one budget, which an in-memory
      # fake cannot demonstrate.
      valkey:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: local
      DATABASE_URL: postgres://platform:platform@127.0.0.1:5432/platform_test?sslmode=disable
      VALKEY_URL: redis://127.0.0.1:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: create the isolated identity test database
        run: |
          psql "postgres://platform:platform@127.0.0.1:5432/platform_test" -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE platform_identity_test' 

      - name: unit + integration tests (race detector needs cgo)
        env:
          CGO_ENABLED: "1"
          # Integration tests create their own schema via the embedded migrations
          # and truncate only identity tables, so they run against a dedicated
          # database and never disturb the smoke-test database below.
          TEST_DATABASE_URL: postgres://platform:platform@127.0.0.1:5432/platform_identity_test?sslmode=disable
        run: go test -race -shuffle=on -covermode=atomic -coverprofile=coverage.out ./...

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -n 25

      - name: build binaries (static, no cgo)
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=ci -X main.commit=${GITHUB_SHA::8}" -o bin/api ./cmd/api
          go build -trimpath -ldflags "-s -w" -o bin/migrate ./cmd/migrate

      - name: apply migrations to the service database (twice, proving idempotency)
        run: |
          ./bin/migrate
          ./bin/migrate
          ./bin/migrate -status

      - name: smoke test the API against the migrated database
        env:
          # 32-byte key, base64. Enables TOTP enrolment in the smoke run so the
          # path is proven outside the test binary as well.
          MFA_KEY: a2tra2tra2tra2tra2tra2tra2tra2tra2tra2tra2s=
          # Passkeys in the smoke run: the RP is localhost, which is the one host
          # the WebAuthn spec allows over plain http.
          WEBAUTHN_RP_ID: localhost
          WEBAUTHN_ORIGINS: http://localhost:8080
        run: |
          set -u
          ./bin/api > api.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8080/readyz > ready.json; then break; fi
            sleep 0.5
          done
          fail() {
            echo "SMOKE FAILURE: $1"
            echo "--- last responses ---"
            for f in ready.json meta.json me.json register.json; do
              [ -f "$f" ] && { echo "== $f"; cat "$f"; echo; }
            done
            echo "--- api.log ---"
            tail -n 60 api.log || true
            exit 1
          }
          cat ready.json; echo
          grep -q '"database":"ok"' ready.json || fail "readiness did not report the database"

          meta_code=$(curl -s -o meta.json -w '%{http_code}' http://127.0.0.1:8080/v1/meta)
          echo "GET /v1/meta -> $meta_code"
          [ "$meta_code" = "200" ] || fail "meta endpoint returned $meta_code"
          grep -q '"minimum_age":18' meta.json || fail "meta payload is missing the age floor"

          me_code=$(curl -s -o me.json -w '%{http_code}' http://127.0.0.1:8080/v1/auth/me)
          echo "GET /v1/auth/me (anonymous) -> $me_code"
          [ "$me_code" = "401" ] || fail "anonymous access to /v1/auth/me returned $me_code"

          register_code=$(curl -s -o register.json -w '%{http_code}' -X POST http://127.0.0.1:8080/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.test","password":"a-very-long-password","device":{"fingerprint":"ci","platform":"web"}}')
          echo "POST /v1/auth/register -> $register_code"
          [ "$register_code" = "201" ] || fail "registration returned $register_code"
          grep -q '"roles":\["fan"\]' register.json || fail "registration did not grant the fan role"

          access=$(python3 -c 'import json,sys; print(json.load(open("register.json"))["tokens"]["access_token"])') \
            || fail "registration response carried no access token"
          sessions_code=$(curl -s -o sessions.json -w '%{http_code}' http://127.0.0.1:8080/v1/auth/sessions \
            -H "Authorization: Bearer $access")
          echo "GET /v1/auth/sessions (bearer) -> $sessions_code"
          [ "$sessions_code" = "200" ] || fail "authenticated session listing returned $sessions_code"
          grep -q '"sessions":\[' sessions.json || fail "session listing payload is empty"

          totp_code=$(curl -s -o totp.json -w '%{http_code}' -X POST http://127.0.0.1:8080/v1/auth/mfa/totp/start \
            -H "Authorization: Bearer $access" -H 'Content-Type: application/json' -d '{"label":"smoke"}')
          echo "POST /v1/auth/mfa/totp/start -> $totp_code"
          [ "$totp_code" = "201" ] || fail "TOTP enrolment returned $totp_code"
          grep -q 'otpauth://totp/' totp.json || fail "TOTP enrolment returned no otpauth URI"

          verify_code=$(curl -s -o verify.json -w '%{http_code}' -X POST http://127.0.0.1:8080/v1/auth/email/verify/request \
            -H "Authorization: Bearer $access")
          echo "POST /v1/auth/email/verify/request -> $verify_code"
          [ "$verify_code" = "202" ] || fail "email verification request returned $verify_code"

          pk_code=$(curl -s -o pk.json -w '%{http_code}' -X POST http://127.0.0.1:8080/v1/auth/webauthn/register/start \
            -H "Authorization: Bearer $access" -H 'Content-Type: application/json' -d '{"label":"smoke"}')
          echo "POST /v1/auth/webauthn/register/start -> $pk_code"
          [ "$pk_code" = "201" ] || fail "passkey registration start returned $pk_code"
          grep -q '"userVerification":"required"' pk.json || fail "passkey options do not require user verification"

          grant_code=$(curl -s -o grant.json -w '%{http_code}' -X POST http://127.0.0.1:8080/v1/admin/roles/grant \
            -H "Authorization: Bearer $access" -H 'Content-Type: application/json' \
            -d '{"user_id":"smoke@example.test","role":"creator"}')
          echo "POST /v1/admin/roles/grant (as fan) -> $grant_code"
          [ "$grant_code" = "403" ] || fail "a fan was able to reach the role-grant endpoint ($grant_code)"

          dup_code=$(curl -s -o duplicate.json -w '%{http_code}' -X POST http://127.0.0.1:8080/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.test","password":"a-very-long-password","device":{"fingerprint":"ci","platform":"web"}}')
          echo "POST /v1/auth/register (duplicate) -> $dup_code"
          [ "$dup_code" = "409" ] || fail "duplicate registration returned $dup_code"

          kill %1 2>/dev/null || true

      - name: upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out
          retention-days: 14

      - name: upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-failure-logs
          path: backend/api.log
          if-no-files-found: ignore

  container:
    name: container image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build image (never pushed from CI without a release tag)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: content-platform/api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
