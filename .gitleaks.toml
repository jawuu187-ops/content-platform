[extend]
useDefault = true

[allowlist]
paths = [
  '''backend/internal/owneraccess/service_test\.go''',
  '''backend/internal/httpapi/owner_activation_test\.go''',
  '''backend/internal/agegate/service_test\.go''',
  '''backend/internal/identity/totp_test\.go''',
  '''\.github/workflows/backend-ci\.yml''',
]
