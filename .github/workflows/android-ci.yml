# Android is built exclusively on GitHub-hosted runners.
#
# Nothing in this repository requires (or permits) an Android SDK, Android Studio
# or Gradle on a developer workstation or a private VPS. If a build breaks, the
# fix lands in this workflow or in the code, never in a local build.
name: Android CI

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
    -Dorg.gradle.parallel=true -Dorg.gradle.caching=true
  CI: "true"

jobs:
  build:
    name: compile, lint and unit tests (no packaging)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: validate Gradle wrapper checksum (if a wrapper is committed)
        if: hashFiles('android/gradle/wrapper/gradle-wrapper.jar') != ''
        uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: provision Gradle (no wrapper required)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: compile, lint and unit test
        run: gradle --no-daemon --stacktrace :app:compileDebugKotlin :app:testDebugUnitTest :app:lintDebug

      - name: assert that no APK or AAB was produced
        run: |
          if find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) | grep -q .; then
            echo "::error::an APK or AAB was produced; packaging is disabled"
            exit 1
          fi

      - name: upload reports (lint, unit tests)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/**
            android/app/build/test-results/**
          retention-days: 14
          if-no-files-found: ignore
