<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Media viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/app.css">
</head><body class="screen">
<div class="phone" style="background:#0b070f">
  <div class="statusbar" style="position:relative;z-index:3"><span>9:41</span><span class="icons"><span class="bar-dot"></span><span class="bar-dot"></span><span class="bar-dot"></span><span class="batt"></span></span></div>

  <div class="appbar" style="position:relative;z-index:3">
    <div class="icon-btn" style="background:rgba(12,8,16,.55)">✕</div>
    <div class="spacer"></div>
    <span class="chip" style="backdrop-filter:blur(6px)">1 / 14</span>
    <div class="icon-btn" style="background:rgba(12,8,16,.55);margin-left:8px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 4v11M8 11l4 4 4-4"/><path d="M5 20h14"/></svg>
    </div>
  </div>

  <div style="position:absolute;left:0;right:0;top:100px;bottom:150px;display:grid;place-items:center;padding:0 16px">
    <div class="media r43" style="width:100%;height:100%;border-radius:18px;background:radial-gradient(75% 85% at 30% 20%,rgba(224,164,88,.6),transparent 62%),radial-gradient(70% 70% at 80% 90%,rgba(156,138,196,.5),transparent 60%),linear-gradient(150deg,#3a2733,#120d18 78%)">
      <div class="grain"></div>
      <!-- watermark -->
      <div style="position:absolute;inset:0;display:grid;place-items:center;transform:rotate(-22deg);opacity:.22">
        <div class="mono" style="font-size:11px;letter-spacing:.12em;color:#fff;text-align:center;line-height:2.2">
          AYA.K@EXAMPLE.COM · 26 NOV 09:41<br>
          AYA.K@EXAMPLE.COM · 26 NOV 09:41<br>
          AYA.K@EXAMPLE.COM · 26 NOV 09:41
        </div>
      </div>
      <div style="position:absolute;left:0;right:0;bottom:0;padding:12px 14px;background:linear-gradient(180deg,transparent,rgba(11,7,15,.85))">
        <div class="row between">
          <span class="tiny mono" style="color:rgba(244,239,234,.75)">viewer 4d1e…9c · 09:41</span>
          <span class="tiny mono" style="color:rgba(244,239,234,.55)">single-use link</span>
        </div>
      </div>
    </div>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;padding:0 20px 30px">
    <div class="eyebrow">Studio set · frame 1</div>
    <p class="small muted" style="margin-top:6px;max-width:320px">
      Screenshots are blocked on this screen. The visible mark ties any copy to your account.
    </p>
    <div class="row" style="gap:10px;margin-top:14px">
      <div class="btn ghost sm" style="flex:1">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M15 5l-7 7 7 7"/></svg>
        Previous
      </div>
      <div class="btn sm" style="flex:1.4">Next frame</div>
    </div>
    <div class="row" style="gap:4px;margin-top:14px;justify-content:center">
      <span style="width:16px;height:3px;border-radius:2px;background:var(--amber)"></span>
      <span style="width:6px;height:3px;border-radius:2px;background:var(--line)"></span>
      <span style="width:6px;height:3px;border-radius:2px;background:var(--line)"></span>
      <span style="width:6px;height:3px;border-radius:2px;background:var(--line)"></span>
      <span style="width:6px;height:3px;border-radius:2px;background:var(--line)"></span>
    </div>
  </div>
</div>
</body></html>
